<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GITAM Housekeeping Feedback</title>
</head>
<body style="font-family:sans-serif;background:#006B6B;color:#fff;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;">
<p>Opening feedback form…</p>
<script>
  // Old QR codes point here. Forward to the main page in feedback mode, keeping ?b= and ?f=.
  (function () {
    var q = new URLSearchParams(location.search);
    var target = 'index.html?feedback=1&b=' + encodeURIComponent(q.get('b') || '') +
                 '&f=' + encodeURIComponent(q.get('f') || '');
    location.replace(target);
  })();
</script>
<noscript><a href="index.html" style="color:#fff">Open feedback form</a></noscript>
</body>
</html>
