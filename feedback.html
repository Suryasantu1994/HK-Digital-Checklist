<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Housekeeping Feedback — GITAM</title>
<style>
  :root{--teal:#006B6B;--teal-dark:#004F4F;--teal-pale:#E0F2F2;--teal-mid:#B2DFDF;--gold:#D4A843;--border:#C8E0E0;--text:#1A2E2E;--muted:#5A7070;--red:#C0392B;}
  *{box-sizing:border-box;margin:0;padding:0;}
  body{font-family:Arial,Helvetica,sans-serif;background:linear-gradient(135deg,var(--teal-dark),var(--teal));min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;color:var(--text);}
  .card{background:#fff;border-radius:18px;padding:28px 24px;width:500px;max-width:100%;box-shadow:0 20px 60px rgba(0,0,0,.25);}
  .title{font-size:20px;font-weight:700;color:var(--teal-dark);text-align:center;}
  .loc{font-size:13px;color:var(--muted);text-align:center;margin:4px 0 16px;font-weight:600;}
  .box{border-radius:10px;padding:12px 14px;margin-bottom:14px;font-size:14px;}
  .staff{background:var(--teal-pale);border:1px solid var(--teal-mid);display:none;}
  .wr{background:#FFF8E8;border:1px solid #FFD580;display:none;}
  .wr strong,.staff strong{color:var(--teal-dark);}
  label{display:block;font-size:12px;font-weight:700;color:var(--teal-dark);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;}
  input,textarea{width:100%;padding:12px 14px;border:2px solid var(--border);border-radius:10px;font-size:15px;font-family:inherit;background:#F4F8F8;}
  input:focus,textarea:focus{outline:none;border-color:var(--teal);background:#fff;}
  textarea{min-height:70px;resize:vertical;}
  .stars{display:flex;gap:6px;justify-content:center;margin:6px 0;}
  .star{background:none;border:none;font-size:34px;color:#ccc;cursor:pointer;line-height:1;}
  .star.on{color:var(--gold);}
  .star-label{text-align:center;font-size:13px;color:var(--muted);min-height:18px;}
  button.submit{width:100%;margin-top:16px;padding:14px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--teal-dark),var(--teal));color:#fff;font-size:15px;font-weight:700;cursor:pointer;}
  button.submit:disabled{opacity:.45;cursor:not-allowed;}
  .err{display:none;margin-top:10px;background:#FFF0F0;border:1px solid #FFCCCC;border-radius:8px;padding:10px 12px;color:var(--red);font-size:13px;}
  .done{display:none;text-align:center;padding:20px 8px;}
  .done h3{color:var(--teal-dark);margin:8px 0;}
</style>
</head>
<body>
<div class="card">
  <div id="formView">
    <div class="title">Housekeeping Feedback</div>
    <div class="loc" id="loc">Loading…</div>
    <div class="box staff" id="staffBox"></div>
    <div class="box wr" id="wrBox"></div>

    <label for="roomNo">Room No. *</label>
    <input id="roomNo" type="text" maxlength="20" placeholder="e.g. 301" autocomplete="off">
    <label for="userId">Your ID *</label>
    <input id="userId" type="text" maxlength="40" placeholder="Student / Staff ID">
    <label for="userName">Your Name *</label>
    <input id="userName" type="text" maxlength="60" placeholder="e.g. Ravi Kumar">

    <label>Rate Cleanliness *</label>
    <div class="stars" id="stars">
      <button type="button" class="star" data-v="1" aria-label="1 star">★</button>
      <button type="button" class="star" data-v="2" aria-label="2 stars">★</button>
      <button type="button" class="star" data-v="3" aria-label="3 stars">★</button>
      <button type="button" class="star" data-v="4" aria-label="4 stars">★</button>
      <button type="button" class="star" data-v="5" aria-label="5 stars">★</button>
    </div>
    <div class="star-label" id="starLabel"></div>

    <label for="comment">Comments (optional)</label>
    <textarea id="comment" maxlength="500" placeholder="Share your feedback about cleanliness…"></textarea>

    <button class="submit" id="submitBtn" type="button" disabled>Submit Feedback</button>
    <div class="err" id="err"></div>
  </div>

  <div class="done" id="doneView">
    <div style="font-size:44px;">✅</div>
    <h3>Thank You!</h3>
    <p style="font-size:14px;color:var(--muted);">Your feedback has been recorded.<br>It helps us maintain cleanliness standards at GITAM University.</p>
  </div>
</div>

<!-- Firebase (compat) — loaded after the form is in place, so the form never waits for it -->
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
<script>
(function () {
  var FIREBASE_CONFIG = {
    apiKey: "AIzaSyCQR-NGbFBz_0Rv4Fvd0etGIL-8RcdNTv4",
    authDomain: "gitam-checklist.firebaseapp.com",
    databaseURL: "https://gitam-checklist-default-rtdb.firebaseio.com",
    projectId: "gitam-checklist",
    storageBucket: "gitam-checklist.firebasestorage.app",
    messagingSenderId: "578218281711",
    appId: "1:578218281711:web:ccb2a9b867316d9d48a91a"
  };
  var WR_KEY_PREFIX = 'gitam_wr_staff_';
  var params = new URLSearchParams(location.search);
  var building = params.get('b') || '';
  var floor = params.get('f') || '';
  var rating = 0;
  var LABELS = ['', 'Poor', 'Fair', 'Good', 'Very Good', 'Excellent'];
  var db = null;
  var washroomMap = {};   // 'floor|ROOM' -> staff name

  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
  function todayKey() {
    var d = new Date();
    return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
  }
  function fsId() { return Array.prototype.slice.call(arguments).join('__').replace(/[\/ ]/g, '_').substring(0, 500); }
  function normRoom(r) { return String(r || '').toUpperCase().replace(/\s+/g, ''); }

  $('loc').textContent = building + (floor ? ' — ' + floor : '');

  // Star rating
  document.querySelectorAll('.star').forEach(function (btn) {
    btn.addEventListener('click', function () { setRating(parseInt(btn.dataset.v, 10)); });
  });
  function setRating(n) {
    rating = n;
    document.querySelectorAll('.star').forEach(function (b) { b.classList.toggle('on', parseInt(b.dataset.v, 10) <= n); });
    $('starLabel').textContent = LABELS[n] || '';
    checkReady();
  }
  function checkReady() {
    $('submitBtn').disabled = !(rating && $('roomNo').value.trim() && $('userId').value.trim() && $('userName').value.trim());
  }
  ['roomNo', 'userId', 'userName'].forEach(function (id) {
    $(id).addEventListener('input', function () { checkReady(); if (id === 'roomNo') updateWashroomStaff(); });
  });

  // Washroom staff for the typed room (Men's washrooms only ever get an entry)
  function updateWashroomStaff() {
    var room = $('roomNo').value.trim();
    var name = room ? washroomMap[floor + '|' + normRoom(room)] : '';
    var box = $('wrBox');
    if (!name) { box.style.display = 'none'; box.innerHTML = ''; return; }
    box.innerHTML = '👷 Washroom staff: <strong>' + esc(name) + '</strong>';
    box.style.display = 'block';
  }

  // Floor staff for today
  function loadFloorStaff() {
    if (!db || !building || !floor) return;
    db.collection('staff').doc(fsId('staff', building, floor, todayKey())).get().then(function (snap) {
      var names = snap.exists && snap.data() && Array.isArray(snap.data().staff) ? snap.data().staff.filter(Boolean) : [];
      if (!names.length) return;
      $('staffBox').innerHTML = '<div>👷 <strong>Assigned Staff</strong></div><div style="margin-top:4px;">' +
        names.map(esc).join(', ') + '</div>';
      $('staffBox').style.display = 'block';
    }).catch(function () {});
  }

  // Washroom staff for this building
  function loadWashroomStaff() {
    if (!db || !building) return;
    db.collection('washroomStaff').where('building', '==', building).get().then(function (snap) {
      var m = {};
      snap.forEach(function (d) {
        var x = d.data() || {};
        if (x.staff && x.floor && x.room) m[x.floor + '|' + normRoom(x.room)] = x.staff;
      });
      washroomMap = m;
      updateWashroomStaff();
    }).catch(function () {});
  }

  function showErr(msg) { var e = $('err'); e.textContent = msg; e.style.display = 'block'; }
  function hideErr() { $('err').style.display = 'none'; }

  function submit() {
    var roomNo = $('roomNo').value.trim(), userId = $('userId').value.trim(), userName = $('userName').value.trim();
    if (!rating) return showErr('Please select a rating.');
    if (!roomNo) { $('roomNo').focus(); return showErr('Please enter your room number.'); }
    if (!userId) { $('userId').focus(); return showErr('Please enter your ID.'); }
    if (!userName) { $('userName').focus(); return showErr('Please enter your name.'); }
    hideErr();
    var staff = [];
    var entry = {
      building: building, floor: floor, staff: staff,
      roomNo: roomNo, userId: userId, userName: userName,
      rating: rating, comment: $('comment').value.trim(),
      ts: new Date().toISOString(), date: new Date().toLocaleDateString('en-IN')
    };
    $('submitBtn').disabled = true;
    var done = function () { $('formView').style.display = 'none'; $('doneView').style.display = 'block'; };
    if (!db) { saveLocal(entry); return done(); }
    db.collection('feedback').add(entry).then(done).catch(function () { saveLocal(entry); done(); });
  }
  function saveLocal(entry) {
    try {
      var all = JSON.parse(localStorage.getItem('gitam_floor_feedback') || '[]');
      all.unshift(entry);
      localStorage.setItem('gitam_floor_feedback', JSON.stringify(all));
    } catch (e) {}
  }

  $('submitBtn').addEventListener('click', submit);

  // Start Firebase after the page is up; the form works even if this fails
  try {
    if (window.firebase) {
      firebase.initializeApp(FIREBASE_CONFIG);
      db = firebase.firestore();
      loadFloorStaff();
      loadWashroomStaff();
    }
  } catch (e) { db = null; }
})();
</script>
</body>
</html>
